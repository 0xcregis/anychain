[package]
name = "anychain-stellar"
description = "A Rust library for Stellar-focused cryptocurrency wallets, enabling seamless transactions on the Stellar network"
keywords = ["blockchain", "crypto", "stellar", "wallet"]
categories = ["cryptography::cryptocurrencies"]
version = "0.1.1"

# Workspace inherited keys
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# anychain-core = { path = "../anychain-core", version = "0.1.8" }
anychain-core = "0.1.8"
serde = { workspace = true }
curve25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
stellar-strkey = "0.0.18"
group = "0.13.0"
hex.workspace = true
stellar-xdr = { version = "27.0.0", features = ["base64"] }

[lints]
workspace = true
